[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "railway-commissioning-simulator"
version = "1.1.0"
description = "Python-based virtual commissioning and diagnostics for a railway door subsystem"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.40",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["railway_commissioning*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
